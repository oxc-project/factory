name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting and linting
        run: pnpm exec biome ci .
      - name: Generate Cloudflare types
        run: pnpm cf-typegen
      - name: Check types
        run: pnpm check:types
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build Oxc sandbox
        run: docker build --tag oxc-factory:ci .
      - name: Verify Oxc tooling
        run: >-
          docker run --rm --entrypoint sh oxc-factory:ci -ec
          'test "$INSTA_REQUIRE_FULL_MATCH" = 1;
          test "$(pnpm --version)" = 12.7.0;
          command -v cargo;
          just --version;
          cargo-insta --version;
          cargo-shear --version;
          ast-grep --version'
